[package]
name = "wordcraft-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Android tablet host for WordCraft"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
egui = { workspace = true }
zeroize = { version = "1", features = ["derive"] }
wordcraft-assistant = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { workspace = true, features = ["wgpu", "android-game-activity", "default_fonts"] }
android-activity = { version = "0.6.1", features = ["game-activity"] }
jni = "0.22.4"
wordcraft-engine = { workspace = true }
wordcraft-doc = { workspace = true }
wordcraft-fonts = { workspace = true }
wordcraft-proof = { workspace = true }
wordcraft-ui-egui = { workspace = true }

